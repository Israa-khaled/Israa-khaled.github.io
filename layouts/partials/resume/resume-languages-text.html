<section id="section-resume-languages" class="resume-languages-text">
  <h2 class="text-2xl font-bold mb-4">{{ .content.title }}</h2>
  <ul class="space-y-2">
    {{ range .content.languages }}
      <li class="flex items-center">
        <span class="font-medium mr-2">{{ .name }}:</span>
        <span class="text-gray-700">{{ .level | default .description }}</span>
      </li>
    {{ end }}
  </ul>
</section>
